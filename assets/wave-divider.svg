<svg fill="none" viewBox="0 0 1200 40" width="100%" height="40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052cc" stop-opacity="0" />
      <stop offset="25%" stop-color="#0052cc" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="1" />
      <stop offset="75%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <path d="M0,20 Q150,5 300,20 T600,20 T900,20 T1200,20" stroke="url(#wave-grad)" stroke-width="2.5" fill="none" filter="url(#glow)" />
  <circle cx="600" cy="20" r="4" fill="#00f2fe" filter="url(#glow)">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
