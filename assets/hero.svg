<svg fill="none" viewBox="0 0 1200 320" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .hero-container {
          width: 100%;
          height: 320px;
          background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 60%, #030712 100%);
          border-radius: 16px;
          border: 1px solid rgba(56, 189, 248, 0.2);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .stars-bg {
          position: absolute;
          inset: 0;
          background-image: 
            radial-gradient(1.5px 1.5px at 40px 60px, #38bdf8 50%, transparent 100%),
            radial-gradient(1.5px 1.5px at 150px 220px, #818cf8 50%, transparent 100%),
            radial-gradient(2px 2px at 300px 90px, #ffffff 50%, transparent 100%),
            radial-gradient(1.5px 1.5px at 450px 260px, #06b6d4 50%, transparent 100%),
            radial-gradient(2px 2px at 600px 40px, #38bdf8 50%, transparent 100%),
            radial-gradient(1px 1px at 750px 280px, #c084fc 50%, transparent 100%),
            radial-gradient(2.5px 2.5px at 900px 120px, #00f2fe 50%, transparent 100%),
            radial-gradient(1.5px 1.5px at 1050px 240px, #818cf8 50%, transparent 100%),
            radial-gradient(2px 2px at 1150px 70px, #ffffff 50%, transparent 100%);
          opacity: 0.7;
          animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
          0% { opacity: 0.4; }
          100% { opacity: 0.9; }
        }

        .glow-circle {
          position: absolute;
          width: 400px;
          height: 200px;
          background: radial-gradient(circle, rgba(0, 210, 255, 0.25) 0%, rgba(99, 102, 241, 0.15) 50%, transparent 70%);
          filter: blur(40px);
          top: -50px;
        }

        .name-title {
          font-size: 46px;
          font-weight: 900;
          letter-spacing: -0.5px;
          margin: 0 0 10px 0;
          background: linear-gradient(135deg, #ffffff 30%, #38bdf8 70%, #818cf8 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
          z-index: 10;
        }

        .subtitle-box {
          background: rgba(15, 23, 42, 0.85);
          border: 1px solid rgba(56, 189, 248, 0.3);
          border-radius: 10px;
          padding: 8px 24px;
          backdrop-filter: blur(10px);
          z-index: 10;
          display: flex;
          align-items: center;
          gap: 16px;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .sub-item {
          font-size: 14px;
          font-weight: 500;
          color: #94a3b8;
          display: flex;
          align-items: center;
          gap: 6px;
        }

        .sub-item b {
          color: #38bdf8;
        }

        .dot-sep {
          color: #475569;
          font-size: 12px;
        }

        .tagline {
          margin-top: 14px;
          font-size: 13px;
          color: #64748b;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          letter-spacing: 0.5px;
          z-index: 10;
        }
      </style>
      <div class="hero-container">
        <div class="stars-bg"></div>
        <div class="glow-circle"></div>
        <h1 class="name-title">Tejas S. Patil</h1>
        <div class="subtitle-box">
          <div class="sub-item">⚡ <b>Building Software</b></div>
          <div class="dot-sep">•</div>
          <div class="sub-item">🎨 <b>Creating Experiences</b></div>
          <div class="dot-sep">•</div>
          <div class="sub-item">🌱 <b>AgriTech & AI</b></div>
        </div>
        <div class="tagline">&lt; Always learning. Never stopping. /&gt;</div>
      </div>
    </div>
  </foreignObject>
</svg>
