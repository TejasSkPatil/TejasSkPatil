<svg fill="none" viewBox="0 0 1200 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .hero-container {
          width: 100%;
          height: 480px;
          background: #080c17;
          border-radius: 24px;
          border: 1px solid rgba(56, 189, 248, 0.15);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          position: relative;
          overflow: hidden;
          box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
          box-sizing: border-box;
        }

        /* Ambient Glow Spheres */
        .ambient-left {
          position: absolute;
          width: 450px;
          height: 450px;
          background: radial-gradient(circle, rgba(14, 116, 144, 0.22) 0%, rgba(2, 132, 199, 0.1) 45%, transparent 70%);
          filter: blur(50px);
          top: 15%;
          left: 5%;
          pointer-events: none;
        }

        .ambient-right {
          position: absolute;
          width: 450px;
          height: 450px;
          background: radial-gradient(circle, rgba(126, 34, 206, 0.2) 0%, rgba(79, 70, 229, 0.08) 45%, transparent 70%);
          filter: blur(50px);
          top: 10%;
          right: 5%;
          pointer-events: none;
        }

        /* Twinkling ambient dots */
        .stars {
          position: absolute;
          inset: 0;
          background-image:
            radial-gradient(1.5px 1.5px at 120px 200px, #38bdf8 60%, transparent 100%),
            radial-gradient(1px 1px at 300px 300px, #c084fc 60%, transparent 100%),
            radial-gradient(1.5px 1.5px at 450px 100px, #6ee7b7 60%, transparent 100%),
            radial-gradient(2px 2px at 700px 360px, #38bdf8 60%, transparent 100%),
            radial-gradient(1.5px 1.5px at 900px 310px, #c084fc 60%, transparent 100%),
            radial-gradient(2px 2px at 1010px 240px, #38bdf8 60%, transparent 100%),
            radial-gradient(1.5px 1.5px at 1050px 100px, #6ee7b7 60%, transparent 100%),
            radial-gradient(1px 1px at 500px 70px, #ffffff 60%, transparent 100%);
          opacity: 0.85;
          animation: pulseStars 5s ease-in-out infinite alternate;
        }

        @keyframes pulseStars {
          0% { opacity: 0.5; }
          100% { opacity: 1; }
        }

        /* Large Central Code Chevron Watermark */
        .center-watermark {
          position: absolute;
          top: 48%;
          left: 50%;
          transform: translate(-50%, -50%);
          font-size: 210px;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          font-weight: 700;
          color: rgba(30, 41, 59, 0.4);
          letter-spacing: -20px;
          user-select: none;
          pointer-events: none;
          z-index: 1;
        }

        /* Floating Code Symbols */
        .symbol-tl {
          position: absolute;
          top: 25%;
          left: 26%;
          font-family: ui-monospace, SFMono-Regular, monospace;
          font-size: 26px;
          color: rgba(71, 85, 105, 0.35);
          font-weight: 500;
          user-select: none;
        }

        .symbol-tr {
          position: absolute;
          top: 25%;
          right: 26%;
          font-family: ui-monospace, SFMono-Regular, monospace;
          font-size: 26px;
          color: rgba(71, 85, 105, 0.35);
          font-weight: 500;
          user-select: none;
        }

        .symbol-bl {
          position: absolute;
          bottom: 28%;
          left: 28%;
          font-family: ui-monospace, SFMono-Regular, monospace;
          font-size: 22px;
          color: rgba(71, 85, 105, 0.3);
          font-weight: 500;
          user-select: none;
        }

        .symbol-br {
          position: absolute;
          bottom: 28%;
          right: 28%;
          font-family: ui-monospace, SFMono-Regular, monospace;
          font-size: 22px;
          color: rgba(71, 85, 105, 0.3);
          font-weight: 500;
          user-select: none;
        }

        .corner-badge {
          position: absolute;
          top: 28px;
          right: 32px;
          padding: 6px 12px;
          border-radius: 8px;
          border: 1px solid rgba(56, 189, 248, 0.2);
          background: rgba(15, 23, 42, 0.6);
          color: #475569;
          font-family: ui-monospace, SFMono-Regular, monospace;
          font-size: 14px;
          font-weight: 600;
        }

        /* Central Typography */
        .content-wrap {
          position: relative;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }

        .name-heading {
          font-size: 52px;
          font-weight: 800;
          letter-spacing: -0.5px;
          margin: 0 0 16px 0;
          background: linear-gradient(90deg, #58a6ff 0%, #bc8cff 50%, #39d353 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0 0 25px rgba(88, 166, 255, 0.25));
        }

        .sub-line-1 {
          font-size: 18px;
          color: #94a3b8;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          margin: 0 0 6px 0;
          letter-spacing: 0.2px;
        }

        .sub-line-2 {
          font-size: 18px;
          color: #94a3b8;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          margin: 0 0 8px 0;
          letter-spacing: 0.2px;
        }

        .sub-line-3 {
          font-size: 18px;
          color: #38bdf8;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          font-weight: 600;
          margin: 0 0 28px 0;
          letter-spacing: 0.3px;
        }

        .bottom-divider {
          width: 320px;
          height: 1px;
          background: linear-gradient(90deg, transparent 0%, rgba(56, 189, 248, 0.4) 50%, transparent 100%);
        }
      </style>

      <div class="hero-container">
        <div class="ambient-left"></div>
        <div class="ambient-right"></div>
        <div class="stars"></div>

        <!-- Floating Code Symbols -->
        <div class="symbol-tl">{ }</div>
        <div class="symbol-tr">[ ]</div>
        <div class="symbol-bl">( )</div>
        <div class="symbol-br">&lt;/&gt;</div>

        <!-- Center Watermark -->
        <div class="center-watermark">&lt; / &gt;</div>

        <!-- Top Right Badge -->
        <div class="corner-badge">&lt;/&gt;</div>

        <!-- Center Name & Text -->
        <div class="content-wrap">
          <h1 class="name-heading">Patil Tejas Sandeshkumar</h1>
          <div class="sub-line-1">Building software.</div>
          <div class="sub-line-2">Creating beautiful experiences.</div>
          <div class="sub-line-3">Always learning. Never stopping.</div>
          <div class="bottom-divider"></div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
