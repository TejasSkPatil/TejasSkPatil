      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0" />
      <stop offset="30%" stop-color="#0052cc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
